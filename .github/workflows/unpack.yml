name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o magnum.zip -x "magnum/.github/*"
          cp -r magnum/. .
          rm -rf magnum magnum.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unpack Magnum project"
          git push
