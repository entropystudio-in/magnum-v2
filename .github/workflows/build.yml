name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        id: root
        run: |
          f=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo contains:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp "${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" magnum.apk
      - uses: actions/upload-artifact@v4
        with:
          name: magnum-apk
          path: magnum.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Magnum build ${{ github.run_number }}
          files: magnum.apk
